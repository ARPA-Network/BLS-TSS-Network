[package]
name = "arpa-core"
description = "ARPA core library"

version.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
exclude.workspace = true

[dependencies]
threshold-bls.workspace = true

futures-util = "0.3"
alloy = { workspace = true, features = ["full", "signer-keystore", "signer-mnemonic"] }
thiserror = "1.0.15"
serde = "1.0.106"
log = "0.4"
chrono = "0.4"
bincode = "1.2.1"
async-trait = "0.1.35"
anyhow = "1.0.31"
thread-id = "4.0.0"
log4rs = "1.2.0"
log-mdc = "0.1.0"
serde_json = "1.0.53"
serde_yaml = "0.8"
parking_lot = "0.12.0"
lazy_static = "1.4.0"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.37.0", features = ["full"] }
alloy = { workspace = true, features = ["full", "signer-keystore", "signer-mnemonic", "provider-anvil-node"] }


[lib]
name = "arpa_core"
path = "src/lib.rs"
